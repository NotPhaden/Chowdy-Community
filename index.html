<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#080808;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
position:relative;
overflow:hidden;
}


body::before{
content:'';
position:fixed;
width:650px;
height:650px;
background:radial-gradient(circle, rgba(155,89,182,0.14), transparent 70%);
top:-220px;
right:-220px;
filter:blur(90px);
z-index:-1;
animation:float1 8s ease-in-out infinite alternate;
}

body::after{
content:'';
position:fixed;
width:550px;
height:550px;
background:radial-gradient(circle, rgba(120,60,180,0.10), transparent 70%);
bottom:-220px;
left:-220px;
filter:blur(110px);
z-index:-1;
animation:float2 10s ease-in-out infinite alternate;
}

@keyframes float1{
from{transform:translateY(0);}
to{transform:translateY(30px);}
}

@keyframes float2{
from{transform:translateY(0);}
to{transform:translateY(-30px);}
}

.container{
width:100%;
max-width:500px;
padding:30px 20px;
}


.logo{
text-align:center;
margin-bottom:28px;
}

.logo img{
width:140px;
border-radius:24px;
box-shadow:0 10px 35px rgba(155,89,182,0.18);
transition:.35s;
}

.logo img:hover{
transform:scale(1.04);
}

h1{
text-align:center;
font-size:2rem;
font-weight:700;
margin-bottom:26px;
color:#d7b8ff;
letter-spacing:-0.5px;
}


.info-box{
background:#131313;
padding:16px 20px;
border-radius:20px;
margin-bottom:16px;
font-size:1rem;
font-weight:600;
border:1px solid rgba(255,255,255,0.05);
box-shadow:0 8px 20px rgba(0,0,0,0.25);
color:#ddd;
}


.link{
display:flex;
align-items:center;
justify-content:space-between;
padding:18px 22px;
margin-bottom:16px;
background:#141414;
border-radius:22px;
text-decoration:none;
color:white;
font-size:1.05rem;
font-weight:600;
transition:.35s;
border:1px solid rgba(255,255,255,0.05);
box-shadow:0 8px 20px rgba(0,0,0,0.25);
position:relative;
overflow:hidden;
}

.link::before{
content:'';
position:absolute;
inset:0;
background:linear-gradient(120deg, transparent, rgba(255,255,255,0.05), transparent);
transform:translateX(-100%);
transition:.7s;
}

.link:hover::before{
transform:translateX(100%);
}

.link:hover{
transform:translateY(-4px);
background:#1b1b1b;
border-color:rgba(155,89,182,0.20);
box-shadow:0 12px 30px rgba(155,89,182,0.10);
}


.icon{
font-size:1.35rem;
}

.arrow{
opacity:.45;
font-size:1.2rem;
}


footer{
text-align:center;
margin-top:24px;
font-size:0.85rem;
color:#666;
}


@media(max-width:500px){
h1{
font-size:1.7rem;
}

.logo img{
width:120px;
}
}
</style>
