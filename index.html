<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#020617;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
position:relative;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
z-index:-1;

background:
radial-gradient(circle at 20% 20%, #9333ea 0%, transparent 35%),
radial-gradient(circle at 80% 20%, #6d28d9 0%, transparent 35%),
radial-gradient(circle at 50% 80%, #a855f7 0%, transparent 35%);

filter:blur(120px);
opacity:0.7;
}

.container{
width:100%;
max-width:500px;
padding:25px;
border-radius:20px;

background:rgba(15,23,42,0.6);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.06);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:130px;
border-radius:20px;
transition:.3s;
box-shadow:0 0 25px rgba(168,85,247,0.4);
}

.logo img:hover{
transform:scale(1.05);
}

h1{
text-align:center;
font-size:1.9rem;
margin-bottom:25px;
color:#e9d5ff;
}

.info-box{
background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.05);

padding:14px 18px;
border-radius:12px;
margin-bottom:14px;

font-size:0.95rem;
color:#ddd6fe;
}

.link{
display:flex;
justify-content:space-between;
align-items:center;

padding:16px 18px;
margin-bottom:12px;

border-radius:10px;

background:rgba(255,255,255,0.03);
border:1px solid rgba(255,255,255,0.05);

text-decoration:none;
color:#c4b5fd;

transition:0.25s;
position:relative;
}

.link::before{
content:"";
position:absolute;
left:-10px;

border-top:12px solid transparent;
border-bottom:12px solid transparent;
border-right:10px solid #a855f7;

opacity:0;
transition:0.25s;
}

.arrow{
opacity:0.5;
}

.link:hover{
background:linear-gradient(90deg, rgba(168,85,247,0.25), transparent);
color:white;
transform:translateX(5px);
}

.link:hover::before{
opacity:1;
}

.icon{
margin-right:8px;
}

footer{
text-align:center;
margin-top:20px;
font-size:0.8rem;
color:#6b7280;
}

</style>
